<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Undercover</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">

    <!-- ÉCRAN 1 : ACCUEIL / SAISIE DES JOUEURS -->
    <section id="screen-home" class="screen active">
      <h1>🕵️ Undercover</h1>
      <p class="subtitle">Ajoutez les joueurs (minimum 3)</p>

      <div class="input-row">
        <input
          type="text"
          id="player-input"
          placeholder="Nom du joueur"
          autocomplete="off"
          maxlength="20"
        />
        <button id="btn-add-player" class="btn-secondary">+</button>
      </div>

      <ul id="players-list"></ul>

      <button id="btn-start" class="btn-primary" disabled>
        Commencer
      </button>
    </section>

    <!-- ÉCRAN 2A : PASSER LE TÉLÉPHONE -->
    <section id="screen-pass" class="screen">
      <p class="hint">Donner le téléphone à</p>
      <h2 id="pass-player-name"></h2>
      <button id="btn-see-word" class="btn-primary">
        Voir mon mot
      </button>
    </section>

    <!-- ÉCRAN 2B : AFFICHAGE DU MOT -->
    <section id="screen-word" class="screen">
      <p class="hint">Ton mot est</p>
      <h2 id="word-display" class="word"></h2>
      <button id="btn-word-seen" class="btn-primary">
        J'ai vu mon mot
      </button>
    </section>

    <!-- ÉCRAN 2C : ÉCRAN NEUTRE INTER-JOUEURS -->
    <section id="screen-next" class="screen">
      <h2>Passez le téléphone<br />au joueur suivant</h2>
      <button id="btn-next-player" class="btn-primary">
        Continuer
      </button>
    </section>

    <!-- ÉCRAN 3 : ANNONCE DU PREMIER JOUEUR -->
    <section id="screen-first" class="screen">
      <p class="hint">Le joueur qui commence</p>
      <h2 id="first-player-name"></h2>
      <button id="btn-start-vote" class="btn-primary">
        Commencer les votes
      </button>
    </section>

    <!-- ÉCRAN 4 : PHASE DE VOTE -->
    <section id="screen-vote" class="screen">
      <h2>Qui éliminer ?</h2>
      <p class="hint">Votez à l'oral puis tapez le nom</p>
      <div id="vote-buttons"></div>
    </section>

    <!-- ÉCRAN 5 : RÉSULTATS -->
    <section id="screen-result" class="screen">
      <h2 id="result-title"></h2>
      <p class="result-text" id="result-text"></p>

      <div class="words-reveal">
        <p><span class="label">Mot principal :</span> <strong id="reveal-main"></strong></p>
        <p><span class="label">Mot undercover :</span> <strong id="reveal-undercover"></strong></p>
        <p><span class="label">Undercover :</span> <strong id="reveal-uc-name"></strong></p>
      </div>

      <button id="btn-replay" class="btn-primary">
        Nouvelle partie
      </button>
      <button id="btn-home" class="btn-secondary">
        Retour à l'accueil
      </button>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
